name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT_CODE"
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== Gradle Build Failed ==="
            echo "=== Full build.log ==="
            cat build.log
            exit $BUILD_EXIT_CODE
          fi

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Find and copy APK
        run: |
          mkdir -p output
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          find . -name "*-debug.apk" -type f -exec cp {} output/ \; 2>/dev/null
          find . -name "*-release-unsigned.apk" -o -name "*-release.apk" | grep -v "unaligned" | xargs -I {} cp {} output/ 2>/dev/null
          echo "=== Output directory ==="
          ls -la output/ 2>/dev/null || echo "output dir is empty"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-android-apk
          path: output/
          retention-days: 30
          if-no-files-found: warn
