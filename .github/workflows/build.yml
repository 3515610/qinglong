name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: List APK files
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -type f
          echo "=== Debug APK dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "not found"
          echo "=== Release APK dir ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "not found"

      - name: Copy APK to output directory
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk output/ 2>/dev/null || true
          echo "=== Output directory ==="
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-android-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
